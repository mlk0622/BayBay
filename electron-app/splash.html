<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Bay</title>
    <style>
        /* Variables par défaut pour le thème Dark */
        :root {
            --bg-grad-start: #12161f;
            --bg-grad-mid: #1a2130;
            --bg-grad-end: #2a3347;
            --border-glow: rgba(255, 255, 255, 0.08);
            --blob-1: rgba(100, 116, 139, 0.3);
            --blob-2: rgba(100, 116, 139, 0.25);
            --text-title: linear-gradient(135deg, #f3f7ff 0%, #cbd5e1 100%);
            --text-version: rgba(203, 213, 225, 0.7);
            --progress-bg: rgba(255, 255, 255, 0.1);
            --progress-bar-grad: linear-gradient(90deg, #64748b, #94a3b8);
            --loading-text: rgba(203, 213, 225, 0.8);
            --modal-bg: rgba(1, 4, 53, 0.75);
            --modal-card-bg: linear-gradient(135deg, rgba(210, 233, 243, 0.12) 0%, rgba(155, 212, 236, 0.04) 100%);
            --modal-card-border: rgba(155, 212, 236, 0.22);
            --modal-title-color: #d2e9f3;
            --modal-version-color: #4fafd9;
            --modal-version-bg: rgba(79, 175, 217, 0.1);
            --modal-notes-color: #9bd4ec;
            --modal-notes-bg: rgba(1, 4, 53, 0.3);
            --modal-notes-border: rgba(155, 212, 236, 0.08);
            --btn-primary-grad: linear-gradient(135deg, #4fafd9 0%, #1f5fb6 100%);
            --btn-primary-border: rgba(255, 255, 255, 0.25);
            --btn-primary-text: #ffffff;
            --btn-primary-shadow: rgba(31, 95, 182, 0.4);
            --btn-secondary-bg: rgba(255, 255, 255, 0.06);
            --btn-secondary-border: rgba(155, 212, 236, 0.15);
            --btn-secondary-text: #9bd4ec;
        }

        /* Variables pour le thème Light (Crème/Beige Liquid Gel Glass) */
        [data-theme="light"] {
            --bg-grad-start: #F2EFF6;
            --bg-grad-mid: #EAE5DF;
            --bg-grad-end: #F0EBE6;
            --border-glow: rgba(255, 255, 255, 0.6);
            --blob-1: rgba(168, 85, 247, 0.07);
            --blob-2: rgba(13, 148, 136, 0.06);
            --text-title: linear-gradient(135deg, #121214 0%, #5C5C64 100%);
            --text-version: #5C5C64;
            --progress-bg: rgba(18, 18, 20, 0.1);
            --progress-bar-grad: linear-gradient(90deg, #A855F7, #C084FC);
            --loading-text: #5C5C64;
            --modal-bg: rgba(242, 239, 246, 0.4);
            --modal-card-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.25) 45%, rgba(45, 212, 191, 0.05) 100%);
            --modal-card-border: rgba(255, 255, 255, 0.6);
            --modal-title-color: #121214;
            --modal-version-color: #A855F7;
            --modal-version-bg: rgba(168, 85, 247, 0.15);
            --modal-notes-color: #5C5C64;
            --modal-notes-bg: rgba(255, 255, 255, 0.5);
            --modal-notes-border: rgba(18, 18, 20, 0.1);
            --btn-primary-grad: linear-gradient(135deg, rgba(168, 85, 247, 0.8) 0%, rgba(192, 132, 252, 0.4) 100%);
            --btn-primary-border: rgba(255, 255, 255, 0.4);
            --btn-primary-text: #ffffff;
            --btn-primary-shadow: rgba(168, 85, 247, 0.25);
            --btn-secondary-bg: #FFFFFF;
            --btn-secondary-border: rgba(92, 92, 100, 0.15);
            --btn-secondary-text: #121214;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            color: #f3f7ff;
        }

        .splash-shell {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(145deg, var(--bg-grad-start) 0%, var(--bg-grad-mid) 48%, var(--bg-grad-end) 100%);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
            border: 1px solid var(--border-glow);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Effets de fond */
        .splash-shell::before,
        .splash-shell::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .splash-shell::before {
            width: 200px;
            height: 200px;
            top: -50px;
            right: -30px;
            background: var(--blob-1);
        }

        .splash-shell::after {
            width: 150px;
            height: 150px;
            left: -40px;
            bottom: -30px;
            background: var(--blob-2);
        }

        .splash-container {
            position: relative;
            z-index: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .animation-container {
            width: 160px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .splash-svg {
            overflow: visible;
        }

        .house {
            transform-origin: 100px 30px;
            opacity: 0;
            transform: translate(0px, -50px) scale(0.6);
        }

        @keyframes fall-in {
            0% {
                opacity: 0;
                transform: translate(0px, -50px) scale(0.5) rotate(0deg);
            }
            15% {
                opacity: 1;
            }
            70% {
                opacity: 1;
                transform: translate(0px, 60px) scale(0.5) rotate(45deg);
            }
            100% {
                opacity: 0;
                transform: translate(0px, 95px) scale(0.05) rotate(90deg);
            }
        }

        .house-1 {
            animation: fall-in 2.4s cubic-bezier(0.4, 0, 1, 1) infinite;
            animation-delay: 0s;
        }

        .house-2 {
            animation: fall-in 2.4s cubic-bezier(0.4, 0, 1, 1) infinite;
            animation-delay: 0.8s;
        }

        .house-3 {
            animation: fall-in 2.4s cubic-bezier(0.4, 0, 1, 1) infinite;
            animation-delay: 1.6s;
        }

        .bag-group {
            transform-origin: 100px 150px;
            animation: bag-bounce 2.4s ease-in-out infinite;
        }

        @keyframes bag-bounce {
            0%, 100% {
                transform: scale(1);
            }
            42% {
                transform: scale(1);
            }
            46% {
                transform: scale(1.08, 0.92);
            }
            50% {
                transform: scale(0.95, 1.05);
            }
            54% {
                transform: scale(1);
            }
            75% {
                transform: scale(1);
            }
            79% {
                transform: scale(1.08, 0.92);
            }
            83% {
                transform: scale(0.95, 1.05);
            }
            87% {
                transform: scale(1);
            }
            8% {
                transform: scale(1);
            }
            12% {
                transform: scale(1.08, 0.92);
            }
            16% {
                transform: scale(0.95, 1.05);
            }
            20% {
                transform: scale(1);
            }
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            background: var(--text-title);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .version {
            font-size: 13px;
            color: var(--text-version);
            margin-top: 6px;
            font-weight: 500;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .progress-container {
            width: 200px;
            height: 6px;
            background: var(--progress-bg);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 30%;
            background: var(--progress-bar-grad);
            border-radius: 3px;
            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {
            0% {
                width: 0%;
                margin-left: 0%;
            }
            50% {
                width: 40%;
                margin-left: 30%;
            }
            100% {
                width: 0%;
                margin-left: 100%;
            }
        }

        .loading-text {
            font-size: 13px;
            color: var(--loading-text);
            font-weight: 500;
        }

        .dots {
            display: inline-block;
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .dots::after {
            content: '';
            animation: dots-content 1.5s steps(4, end) infinite;
        }

        @keyframes dots-content {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75%, 100% { content: '...'; }
        }

        /* Liquid Glass Update Modal */
        .glass-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .glass-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--modal-card-bg);
            border: 1px solid var(--modal-card-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 750;
            color: var(--modal-title-color);
            letter-spacing: 0.5px;
        }

        .modal-version {
            font-size: 14px;
            color: var(--modal-version-color);
            font-weight: 600;
            background: var(--modal-version-bg);
            padding: 4px 12px;
            border-radius: 99px;
            align-self: center;
        }

        .modal-notes {
            font-size: 13px;
            color: var(--modal-notes-color);
            background: var(--modal-notes-bg);
            border: 1px solid var(--modal-notes-border);
            border-radius: 12px;
            padding: 12px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-glass {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-glass-primary {
            background: var(--btn-primary-grad);
            border: 1px solid var(--btn-primary-border);
            color: var(--btn-primary-text);
            box-shadow: 0 4px 15px var(--btn-primary-shadow);
        }

        .btn-glass-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--btn-primary-shadow);
            filter: brightness(1.1);
        }

        .btn-glass-secondary {
            background: var(--btn-secondary-bg);
            border: 1px solid var(--btn-secondary-border);
            color: var(--btn-secondary-text);
        }

        .btn-glass-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            filter: brightness(1.05);
        }
    </style>
</head>
<body>
    <div class="splash-shell">
        <div class="splash-container">
            <div class="logo-container">
                <div class="animation-container">
                    <svg class="splash-svg" viewBox="0 0 200 200" width="160" height="160">
                        <!-- Houses falling -->
                        <g class="house house-1">
                            <polygon points="100,5 80,25 120,25" fill="#38bdf8" />
                            <rect x="85" y="25" width="30" height="30" rx="3" fill="#38bdf8" />
                            <rect x="96" y="38" width="8" height="17" rx="1.5" fill="#1e293b" />
                        </g>
                        <g class="house house-2">
                            <polygon points="100,5 80,25 120,25" fill="#60a5fa" />
                            <rect x="85" y="25" width="30" height="30" rx="3" fill="#60a5fa" />
                            <rect x="96" y="38" width="8" height="17" rx="1.5" fill="#1e293b" />
                        </g>
                        <g class="house house-3">
                            <polygon points="100,5 80,25 120,25" fill="#0284c7" />
                            <rect x="85" y="25" width="30" height="30" rx="3" fill="#0284c7" />
                            <rect x="96" y="38" width="8" height="17" rx="1.5" fill="#1e293b" />
                        </g>

                        <!-- The bag (sac) -->
                        <g class="bag-group">
                            <!-- Drawstring Ties -->
                            <path d="M 90,80 C 85,76 75,76 70,82 C 67,86 70,92 75,92 C 82,92 87,85 90,80 Z" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
                            <path d="M 110,80 C 115,76 125,76 130,82 C 133,86 130,92 125,92 C 118,92 113,85 110,80 Z" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
                            <!-- Drawstring Knot -->
                            <circle cx="100" cy="80" r="6" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
                            <!-- Main Pouch Body -->
                            <path d="M 85,83 C 70,83 45,95 45,130 C 45,165 70,175 100,175 C 130,175 155,165 155,130 C 155,95 130,83 115,83 Z" 
                                  fill="rgba(14, 165, 233, 0.18)" 
                                  stroke="#0284c7" 
                                  stroke-width="4.5" 
                                  stroke-linejoin="round" />
                            <!-- Drawstring Collar -->
                            <path d="M 80,78 C 85,82 92,84 100,84 C 108,84 115,82 120,78 C 123,73 120,68 115,68 C 108,68 104,73 100,73 C 96,73 92,68 85,68 C 80,68 77,73 80,78 Z" 
                                  fill="rgba(56, 189, 248, 0.3)" 
                                  stroke="#0284c7" 
                                  stroke-width="3.5" />
                        </g>
                    </svg>
                </div>
                <div class="title">Bay Bay</div>
                <div class="version"></div>
            </div>
            <div class="loading">
                <div class="progress-container">
                    <div class="progress-bar"></div>
                </div>
            </div>
        </div>

        <!-- Liquid Glass Update Modal -->
        <div id="update-modal" class="glass-modal">
            <div class="modal-content">
                <div class="modal-title">Mise à jour disponible</div>
                <div id="update-version" class="modal-version">v0.0.0</div>
                <div id="update-notes" class="modal-notes">Notes de version...</div>
                <div class="modal-buttons">
                    <div class="btn-glass btn-glass-primary" onclick="acceptUpdate()">Télécharger & Installer</div>
                    <div class="btn-glass btn-glass-secondary" onclick="declineUpdate()">Plus tard</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const version = params.get('version') || 'inconnue';
        document.querySelector('.version').textContent = `Version ${version}`;

        // Appliquer le thème reçu en paramètre
        const theme = params.get('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        function acceptUpdate() {
            document.title = 'update-accept';
            document.getElementById('update-modal').classList.remove('active');
        }

        function declineUpdate() {
            document.title = 'update-decline';
            document.getElementById('update-modal').classList.remove('active');
        }

        window.showUpdateModal = function(ver, notes) {
            document.getElementById('update-version').textContent = 'v' + ver;
            document.getElementById('update-notes').innerHTML = notes.replace(/\n/g, '<br>');
            document.getElementById('update-modal').classList.add('active');
        };
    </script>
</body>
</html>
