<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bay Bay</title>
    <style>
        :root {
            --bg-main: #181a26;
            --text-title: #ffffff;
            --text-version: rgba(255, 255, 255, 0.7);
            --progress-bg: rgba(255, 255, 255, 0.12);
            --progress-fill: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            padding: 12px;
        }

        .splash-shell {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 45%, #222638 0%, #151722 75%, #0f1018 100%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        /* 3D Marble Door Container */
        .door-container {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .door-img {
            width: 135px;
            height: 135px;
            object-fit: contain;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.55));
        }

        /* Title & Version styling */
        .title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.6), 0 2px 10px rgba(0, 0, 0, 0.5);
            margin-top: 2px;
        }

        .version {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.3px;
        }

        /* Sleek Glowing Progress Bar */
        .loading-box {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .progress-track {
            width: 320px;
            height: 8px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6), 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .progress-bar-glow {
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 9999px;
            box-shadow: 0 0 12px #ffffff, 0 0 25px rgba(255, 255, 255, 0.9);
            animation: fictive-loading 3.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes fictive-loading {
            0% {
                width: 0%;
                opacity: 0.6;
            }
            45% {
                width: 65%;
                opacity: 1;
            }
            85% {
                width: 95%;
                opacity: 1;
            }
            100% {
                width: 100%;
                opacity: 0.8;
            }
        }

        .status-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
        }

        /* Update Modal Overlay */
        .glass-modal {
            position: absolute;
            inset: 0;
            background: rgba(15, 16, 24, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .glass-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(135deg, rgba(39, 42, 60, 0.9) 0%, rgba(24, 26, 38, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .modal-version {
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 9999px;
            align-self: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .modal-notes {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            line-height: 1.45;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .btn-modal {
            flex: 1;
            padding: 11px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-modal-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
        }

        .btn-modal-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .btn-modal-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .btn-modal-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="splash-shell">
        <div class="splash-container">
            <!-- 3D Open Door Logo Image -->
            <div class="door-container">
                <img src="door_logo.png" class="door-img" alt="Logo BayBay">
            </div>

            <!-- Title & Version -->
            <div>
                <div class="title">Bay Bay</div>
                <div class="version">Version 3.9.2</div>
            </div>

            <!-- Loading Progress Bar -->
            <div class="loading-box">
                <div class="progress-track">
                    <div class="progress-bar-glow"></div>
                </div>
                <div class="status-text">Chargement en cours...</div>
            </div>
        </div>

        <!-- Update Modal Overlay -->
        <div id="update-modal" class="glass-modal">
            <div class="modal-card">
                <div class="modal-title">Mise à jour disponible</div>
                <div id="update-version" class="modal-version">v3.9.2</div>
                <div id="update-notes" class="modal-notes">Des améliorations visuelles et correctifs sont disponibles.</div>
                <div class="modal-buttons">
                    <div class="btn-modal btn-modal-primary" onclick="acceptUpdate()">Télécharger & Installer</div>
                    <div class="btn-modal btn-modal-secondary" onclick="declineUpdate()">Plus tard</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const version = params.get('version') || '3.9.2';
        document.querySelector('.version').textContent = `Version ${version}`;

        function acceptUpdate() {
            document.title = 'update-accept';
            document.getElementById('update-modal').classList.remove('active');
        }

        function declineUpdate() {
            document.title = 'update-decline';
            document.getElementById('update-modal').classList.remove('active');
        }

        window.showUpdateModal = function(ver, notes) {
            document.getElementById('update-version').textContent = 'v' + ver;
            if (notes) {
                document.getElementById('update-notes').innerHTML = notes.replace(/\n/g, '<br>');
            }
            document.getElementById('update-modal').classList.add('active');
        };
    </script>
</body>
</html>
