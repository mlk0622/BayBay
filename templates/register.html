{% extends "base.html" %}
{% block title %}Créer un compte - BayBay{% endblock %}

{% block content %}
<div class="glass-card max-w-[420px] mx-auto my-[80px] p-8 text-center">
    <h2 class="text-2xl font-bold mb-2">Créer un compte</h2>
    <p class="text-sm opacity-85 mb-6">Rejoignez le Cloud BayBay</p>

    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
        <div>
            <input type="email" name="email" placeholder="Adresse email" required class="w-full">
        </div>
        <div>
            <input type="password" name="password" placeholder="Mot de passe robuste" required class="w-full">
        </div>
        <button type="submit" class="w-full cursor-pointer mt-2">Créer mon compte</button>
    </form>

    <p class="mt-6 text-sm opacity-80">
        Déjà inscrit ? <a href="{{ url_for('login') }}" class="text-primary hover:underline font-semibold">Se connecter</a>
    </p>
</div>
{% endblock %}
