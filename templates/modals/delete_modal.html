<div id="deleteModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 p-4" style="display:none;">
    <div class="glass-card w-full max-w-sm p-6 my-auto text-center space-y-4">
        <div class="w-14 h-14 rounded-full bg-red-500/20 border border-red-500/30 flex items-center justify-center mx-auto">
            <i class="fas fa-trash-alt text-2xl text-white"></i>
        </div>
        <h3 class="text-xl font-bold text-white">Confirmer la suppression</h3>
        <p class="text-white/80 text-sm" id="deleteMessage">Êtes-vous sûr de vouloir supprimer cet élément ?</p>
        <input type="hidden" id="deleteType">
        <input type="hidden" id="deleteId">
        <div class="flex gap-3 pt-2">
            <button type="button" onclick="closeModal('deleteModal')"
                    class="flex-1 ios-button-secondary text-white font-bold text-sm">
                <i class="fas fa-times mr-2 text-white"></i>Annuler
            </button>
            <button type="button" onclick="confirmDelete()"
                    class="flex-1 ios-button-danger text-white font-bold text-sm">
                <i class="fas fa-trash-alt mr-2 text-white"></i>Supprimer
            </button>
        </div>
    </div>
</div>
