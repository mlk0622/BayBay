<div id="bienModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 p-4" style="display:none;">
    <div class="glass-card w-full max-w-md p-6 space-y-4 my-auto">
        <div class="flex items-center justify-between border-b border-white/20 pb-3">
            <h3 class="text-xl font-bold text-white flex items-center gap-2" id="bienModalTitle">
                <i class="fas fa-home text-white"></i><span>Nouveau Bien</span>
            </h3>
            <button type="button" onclick="closeModal('bienModal')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20">
                <i class="fas fa-times text-white"></i>
            </button>
        </div>
        <form id="bienForm">
            <input type="hidden" name="sci_id" id="bienSciId">
            <input type="hidden" name="bien_id" id="bienEditId">
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Adresse *</label>
                    <input type="text" name="adresse" id="bienAdresse" required
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                           placeholder="Ex: 12 rue de la Paix">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Code postal</label>
                        <input type="text" name="code_postal" id="bienCodePostal"
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" placeholder="75001">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Ville</label>
                        <input type="text" name="ville" id="bienVille"
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary" placeholder="Paris">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Type de bien *</label>
                    <select name="type_bien" id="bienType" required
                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        <option value="Immeuble">Immeuble</option>
                        <option value="Entrepot">Entrepôt</option>
                    </select>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-medium text-slate-700">Charges du bien</label>
                        <button type="button" id="addBienChargeBtn"
                                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm text-slate-700">
                            <i class="fas fa-plus mr-1"></i>Ajouter
                        </button>
                    </div>
                    <div id="bienChargesContainer" class="space-y-2"></div>
                    <p class="text-slate-400 text-xs mt-1">Ajoute plusieurs lignes de charges (libellé + montant).</p>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
                <button type="button" onclick="closeModal('bienModal')"
                        class="px-4 py-2 bg-white/10 border border-white/30 text-white rounded-xl font-bold hover:bg-white/20">
                    Annuler
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary-dark">
                    <i class="fas fa-check mr-2"></i>Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>
