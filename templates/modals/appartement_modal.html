<div id="appartModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 p-4" style="display:none;">
    <div class="glass-card w-full max-w-md p-6 space-y-4 my-auto">
        <div class="flex items-center justify-between border-b border-white/20 pb-3">
            <h3 class="text-xl font-bold text-white flex items-center gap-2" id="appartModalTitle">
                <i class="fas fa-door-open text-white"></i><span>Nouveau Lot</span>
            </h3>
            <button type="button" onclick="closeModal('appartModal')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20">
                <i class="fas fa-times text-white"></i>
            </button>
        </div>
        <form id="appartForm">
            <input type="hidden" name="bien_id" id="appartBienId">
            <input type="hidden" name="appart_id" id="appartEditId">
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Type *</label>
                    <select name="type_appartement" id="appartType" required
                            class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary">
                        <option value="Appartement">Appartement</option>
                        <option value="Box">Box</option>
                        <option value="Local Commerciale">Local Commerciale</option>
                        <option value="Entrepot">Entrepôt</option>
                    </select>
                </div>

                <!-- Appartement: étage + numéro de porte -->
                <div id="appartNumeroPorteGroup" class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">N° de porte *</label>
                        <input type="text" name="numero_porte" id="appartNumero"
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                               placeholder="A1">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Étage</label>
                        <input type="text" name="etage" id="appartEtage"
                               class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                               placeholder="3e">
                    </div>
                </div>

                <!-- Box: numéro du box uniquement -->
                <div id="appartNumeroBoxGroup" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Numéro du box *</label>
                    <input type="text" name="numero_box" id="appartNumeroBox"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                           placeholder="B12">
                </div>

                <!-- Local Commerciale: nom de l'entreprise -->
                <div id="appartNomEntrepriseGroup" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Nom de l'entreprise locataire</label>
                    <input type="text" name="nom_entreprise" id="appartNomEntreprise"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                           placeholder="SARL Dupont Commerce">
                </div>

                <!-- Charges dynamiques (Appartement + Local Commerciale) -->
                <div id="appartChargesGroup" class="hidden">
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-sm font-medium text-slate-700">Charges</label>
                        <button type="button" id="addAppartChargeBtn"
                                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm text-slate-700">
                            <i class="fas fa-plus mr-1"></i>Ajouter
                        </button>
                    </div>
                    <div id="appartChargesContainer" class="space-y-2"></div>
                    <p class="text-slate-400 text-xs mt-1">Ajoutez les lignes de charges (libellé + montant). Le total sera calculé automatiquement.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Loyer mensuel HC (€)</label>
                    <input type="number" name="loyer_mensuel" id="appartLoyer" step="0.01" min="0"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                           placeholder="800">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Surface (m²)</label>
                    <input type="number" name="surface" id="appartSurface" step="0.01" min="0"
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary"
                           placeholder="45">
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 flex justify-end gap-3">
                <button type="button" onclick="closeModal('appartModal')"
                        class="px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-50">
                    Annuler
                </button>
                <button type="submit"
                        class="px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary-dark">
                    <i class="fas fa-check mr-2"></i>Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>
