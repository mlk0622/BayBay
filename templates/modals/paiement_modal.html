<div id="paiementModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50" style="display:none;">
    <div class="glass-card w-full max-w-md mx-4 p-6 space-y-4">
        <div class="flex items-center justify-between border-b border-white/20 pb-3">
            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-euro-sign text-white"></i>Enregistrer un paiement
            </h3>
            <button type="button" onclick="closeModal('paiementModal')" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20">
                <i class="fas fa-times text-white"></i>
            </button>
        </div>
        <form id="paiementForm">
            <input type="hidden" name="locataire_id" id="paiementLocataireId">
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-white mb-1">Mois *</label>
                        <select name="mois" id="paiementMois" required
                                class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                            <option value="1">Janvier</option>
                            <option value="2">Février</option>
                            <option value="3">Mars</option>
                            <option value="4">Avril</option>
                            <option value="5">Mai</option>
                            <option value="6">Juin</option>
                            <option value="7">Juillet</option>
                            <option value="8">Août</option>
                            <option value="9">Septembre</option>
                            <option value="10">Octobre</option>
                            <option value="11">Novembre</option>
                            <option value="12">Décembre</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-white mb-1">Année *</label>
                        <input type="number" name="annee" id="paiementAnnee" required min="2020" max="2030"
                               class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Montant payé (€) *</label>
                    <input type="number" name="montant_paye" id="paiementMontant" step="0.01" min="0" required
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium"
                           placeholder="850.00">
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Date de paiement</label>
                    <input type="date" name="date_paiement" id="paiementDate"
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Mode de paiement</label>
                    <select name="mode_paiement" id="paiementMode"
                            class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                        <option value="">-- Sélectionner --</option>
                        <option value="Virement">Virement</option>
                        <option value="Chèque">Chèque</option>
                        <option value="Espèces">Espèces</option>
                        <option value="Prélèvement">Prélèvement</option>
                    </select>
                </div>
            </div>
            <div class="pt-4 border-t border-white/20 flex justify-end gap-3 mt-4">
                <button type="button" onclick="closeModal('paiementModal')"
                        class="px-4 py-2 bg-white/10 border border-white/30 text-white rounded-xl font-bold hover:bg-white/20">
                    Annuler
                </button>
                <button type="submit"
                        class="ios-button-success text-white font-bold px-6 py-2 rounded-xl flex items-center gap-2" style="background: linear-gradient(135deg, #34d399 0%, #10b981 100%) !important;">
                    <i class="fas fa-check text-white"></i>Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>
