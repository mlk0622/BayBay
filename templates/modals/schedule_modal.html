<!-- Modal de programmation d'appel de loyer -->
<div id="scheduleModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/70 p-4" style="display:none;">
    <div class="glass-card w-full max-w-3xl p-6 space-y-4 my-auto max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-white/20 pb-3">
            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                <i class="fas fa-calendar-alt text-white"></i>
                <span>Programmer un Appel de Loyer</span>
            </h3>
            <button type="button" onclick="closeScheduleModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20">
                <i class="fas fa-times text-white"></i>
            </button>
        </div>

        <form id="scheduleForm" data-no-spa="true" class="space-y-4">
            <input type="hidden" id="schedule_locataire_id" name="locataire_id">
            <input type="hidden" id="schedule_mois" name="mois">
            <input type="hidden" id="schedule_annee" name="annee">
            <div class="space-y-4">
                <!-- Locataire -->
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Locataire *</label>
                    <div id="schedule_locataire_select_container" class="hidden">
                        <select id="schedule_locataire_select" onchange="onScheduleLocataireSelectChange(this)"
                                class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                            <option value="">-- Sélectionner un locataire --</option>
                            {% if locataires %}
                            {% for loc in locataires %}
                            <option value="{{ loc.id }}" data-nom="{{ loc.nom_complet }}" data-email="{{ loc.email or '' }}">{{ loc.nom_complet }}</option>
                            {% endfor %}
                            {% endif %}
                        </select>
                    </div>
                    <input type="text" id="schedule_locataire_nom" readonly
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                </div>

                <!-- Email du locataire -->
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Email du locataire</label>
                    <input type="email" id="schedule_locataire_email" readonly
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                </div>

                <div>
                    <label class="block text-sm font-bold text-white mb-1">Période de l'appel</label>
                    <input type="text" id="schedule_periode_label" readonly
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                </div>

                <!-- Email expéditeur -->
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Email expéditeur (optionnel)</label>
                    <input type="email" id="email_expediteur" name="email_expediteur"
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium placeholder-white/50"
                           placeholder="Laissez vide pour utiliser la config par défaut">
                    <p class="text-white/60 text-xs mt-1">Si vide, utilise la configuration par défaut.</p>
                </div>

                <!-- Sujet du mail -->
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Sujet du mail (optionnel)</label>
                    <input type="text" id="schedule_sujet" name="sujet"
                           class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium placeholder-white/50"
                           placeholder="Laissez vide pour utiliser le sujet par défaut">
                </div>

                <!-- Date et heure d'envoi -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-white mb-1">Date</label>
                        <input type="date" id="schedule_date" name="date_envoi_date" required
                               class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-white mb-1">Heure</label>
                        <input type="time" id="schedule_time" name="date_envoi_time" required
                               class="w-full px-4 py-2 border border-white/30 rounded-xl text-white bg-black/50 font-medium">
                    </div>
                </div>

                <div>
                    <label class="inline-flex items-center gap-2 text-sm font-medium text-white cursor-pointer">
                        <input type="checkbox" id="schedule_recurrent" name="recurrent" class="accent-purple-500">
                        <span>Répéter tous les mois automatiquement</span>
                    </label>
                    <p class="text-white/60 text-xs mt-1">Une nouvelle programmation sera créée pour le mois suivant après chaque envoi réussi.</p>
                </div>

                <!-- Message personnalisé -->
                <div>
                    <label class="block text-sm font-bold text-white mb-1">Message personnalisé (optionnel)</label>
                    <div class="rich-editor-shell border border-white/30 rounded-xl overflow-hidden bg-black/50" data-target="schedule_message">
                        <div class="rich-editor-toolbar bg-white/10 border-b border-white/30 p-2 flex gap-2">
                            <button type="button" data-command="bold" class="text-white hover:bg-white/20 p-1 rounded"><strong>B</strong></button>
                            <button type="button" data-command="italic" class="text-white hover:bg-white/20 p-1 rounded"><em>I</em></button>
                            <button type="button" data-command="underline" class="text-white hover:bg-white/20 p-1 rounded"><u>U</u></button>
                            <button type="button" data-command="insertUnorderedList" class="text-white hover:bg-white/20 p-1 rounded"><i class="fas fa-list-ul"></i></button>
                            <button type="button" data-command="removeFormat" class="text-white hover:bg-white/20 p-1 rounded">Tx</button>
                            <select data-variable-select aria-label="Variables du mail" class="bg-black/50 text-white border border-white/30 rounded p-1"></select>
                            <button type="button" data-insert-variable class="text-white hover:bg-white/20 p-1 rounded text-sm">Insérer</button>
                            <label title="Couleur du texte" class="flex items-center">
                                <input type="color" data-command="foreColor" value="#ffffff" class="bg-transparent border-0 w-6 h-6 p-0 cursor-pointer">
                            </label>
                            <select data-command="fontName" aria-label="Police du mail" title="Police" class="bg-black/50 text-white border border-white/30 rounded p-1">
                                <option value="Arial">Arial</option>
                                <option value="Verdana">Verdana</option>
                                <option value="Tahoma">Tahoma</option>
                                <option value="Trebuchet MS">Trebuchet</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Times New Roman">Times New Roman</option>
                                <option value="Courier New">Courier New</option>
                            </select>
                        </div>
                        <div id="scheduleMessageEditor" class="rich-editor-area p-3 text-white min-h-[100px]" contenteditable="true" data-placeholder="Rédigez ici le message personnalisé..."></div>
                        <textarea id="schedule_message" name="message" class="hidden"></textarea>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 pt-4 border-t border-white/20">
                <button type="button" onclick="previewScheduleMessage()"
                        class="px-4 py-2 bg-white/10 border border-white/30 text-white rounded-xl font-bold hover:bg-white/20">
                    <i class="fas fa-eye mr-2 text-white"></i>Aperçu
                </button>
                <button type="button" onclick="closeScheduleModal()"
                        class="px-4 py-2 bg-white/10 border border-white/30 text-white rounded-xl font-bold hover:bg-white/20">
                    Annuler
                </button>
                <button type="button" onclick="submitScheduleForm(event)"
                        class="ios-button-purple text-white font-bold px-6 py-2 rounded-xl flex items-center gap-2" style="background: linear-gradient(135deg, #c084fc 0%, #8b5cf6 100%) !important;">
                    <i class="fas fa-calendar-check text-white font-bold"></i>
                    <span class="text-white font-bold">Programmer</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function formatSchedulePeriodeLabel(mois, annee) {
    const moisFr = {
        1: 'Janvier', 2: 'Février', 3: 'Mars', 4: 'Avril',
        5: 'Mai', 6: 'Juin', 7: 'Juillet', 8: 'Août',
        9: 'Septembre', 10: 'Octobre', 11: 'Novembre', 12: 'Décembre'
    };
    return `${moisFr[mois] || mois} ${annee}`;
}

function onScheduleLocataireSelectChange(select) {
    const opt = select.options[select.selectedIndex];
    const locId = select.value;
    const nom = opt ? (opt.getAttribute('data-nom') || opt.text) : '';
    const email = opt ? (opt.getAttribute('data-email') || '') : '';
    document.getElementById('schedule_locataire_id').value = locId || '';
    document.getElementById('schedule_locataire_nom').value = nom || '';
    document.getElementById('schedule_locataire_email').value = email || '';
}

function openScheduleModal(locataireId, locataireNom, locataireEmail, targetMois, targetAnnee) {
    const selectContainer = document.getElementById('schedule_locataire_select_container');
    const nomInput = document.getElementById('schedule_locataire_nom');

    if (locataireId) {
        if (selectContainer) selectContainer.classList.add('hidden');
        if (nomInput) nomInput.classList.remove('hidden');
        document.getElementById('schedule_locataire_id').value = locataireId;
        document.getElementById('schedule_locataire_nom').value = locataireNom || '';
        document.getElementById('schedule_locataire_email').value = locataireEmail || '';
    } else {
        if (selectContainer) selectContainer.classList.remove('hidden');
        if (nomInput) nomInput.classList.add('hidden');
        document.getElementById('schedule_locataire_id').value = '';
        document.getElementById('schedule_locataire_nom').value = '';
        document.getElementById('schedule_locataire_email').value = '';
        const select = document.getElementById('schedule_locataire_select');
        if (select) select.value = '';
    }

    const now = new Date();
    const defaultPeriod = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    const mois = Number(targetMois) || (defaultPeriod.getMonth() + 1);
    const annee = Number(targetAnnee) || defaultPeriod.getFullYear();

    document.getElementById('schedule_mois').value = mois;
    document.getElementById('schedule_annee').value = annee;
    document.getElementById('schedule_periode_label').value = formatSchedulePeriodeLabel(mois, annee);

    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    document.getElementById('schedule_date').value = tomorrow.toISOString().split('T')[0];
    document.getElementById('schedule_time').value = '09:00';
    document.getElementById('schedule_recurrent').checked = false;

    if (window.openModal) {
        openModal('scheduleModal');
    } else {
        const modal = document.getElementById('scheduleModal');
        if (modal) {
            modal.style.zIndex = '99999';
            modal.style.display = 'flex';
            modal.classList.remove('hidden');
        }
    }
}

function closeScheduleModal() {
    if (window.closeModal) {
        closeModal('scheduleModal');
    } else {
        const modal = document.getElementById('scheduleModal');
        if (modal) {
            modal.style.display = 'none';
            modal.classList.add('hidden');
        }
    }
    document.getElementById('scheduleForm').reset();
    if (window.setRichTextEditorValue) {
        setRichTextEditorValue('schedule_message', '');
    }
    document.getElementById('schedule_periode_label').value = '';
}

function previewScheduleMessage() {
    const contenu = window.getRichTextEditorValue ? getRichTextEditorValue('schedule_message') : (document.getElementById('schedule_message').value || '');
    const nom = document.getElementById('schedule_locataire_nom').value || 'locataire';
    const body = contenu || '<p>Aucun message personnalisé saisi.</p>';

    if (window.openEmailPreviewModal) {
        openEmailPreviewModal('Aperçu - Message de programmation', `Message pour ${nom}`, body);
        return;
    }

    showNotification('Prévisualisation indisponible', 'warning');
}

async function submitScheduleForm(e) {
    if (e && e.preventDefault) e.preventDefault();

    const locId = document.getElementById('schedule_locataire_id')?.value?.trim();
    let dateVal = document.getElementById('schedule_date')?.value;
    const timeVal = document.getElementById('schedule_time')?.value || '09:00';
    let moisVal = document.getElementById('schedule_mois')?.value;
    let anneeVal = document.getElementById('schedule_annee')?.value;
    const sujetVal = document.getElementById('schedule_sujet')?.value || '';
    const recurrentVal = document.getElementById('schedule_recurrent')?.checked || false;

    // Auto-fill missing date with tomorrow
    if (!dateVal) {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        dateVal = tomorrow.toISOString().split('T')[0];
        const dateEl = document.getElementById('schedule_date');
        if (dateEl) dateEl.value = dateVal;
    }

    // Auto-fill missing mois/annee with next month
    if (!moisVal || !anneeVal) {
        const now = new Date();
        const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        moisVal = moisVal || String(next.getMonth() + 1);
        anneeVal = anneeVal || String(next.getFullYear());
    }

    if (!locId) {
        showNotification('Erreur: locataire non identifié', 'error');
        return;
    }

    const message = (window.getRichTextEditorValue ? getRichTextEditorValue('schedule_message') : '') || '';

    const data = {
        locataire_id: parseInt(locId, 10),
        locataires_ids: [parseInt(locId, 10)],
        sujet: sujetVal || null,
        date_envoi: dateVal,
        heure_envoi: timeVal,
        mois: parseInt(moisVal, 10),
        annee: parseInt(anneeVal, 10),
        message: message,
        recurrent: recurrentVal,
        tous_locataires: false
    };

    console.log('[Schedule] Submitting:', data);

    // Disable button to prevent double-submit
    const btn = document.querySelector('#scheduleModal button[onclick*="submitScheduleForm"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Programmation…'; }

    try {
        const response = await fetch('/api/programmation-appel', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json().catch(() => ({}));
        console.log('[Schedule] Response:', response.status, result);

        if (response.ok && result.success !== false) {
            closeScheduleModal();
            showNotification('✅ Appel de loyer programmé avec succès !', 'success');
            setTimeout(() => { if (window.refreshPage) window.refreshPage(); }, 800);
        } else {
            showNotification('Erreur: ' + (result.error || result.message || 'Impossible de programmer'), 'error');
        }
    } catch (error) {
        console.error('[Schedule] Fetch error:', error);
        showNotification('Erreur réseau lors de la programmation', 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-calendar-check mr-2"></i>Programmer'; }
    }
}

// Also support form submit event (belt + suspenders)
(function() {
    const form = document.getElementById('scheduleForm');
    if (form) form.onsubmit = function(e) { e.preventDefault(); submitScheduleForm(e); };
})();
</script>
